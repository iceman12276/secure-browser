# template-source: ~/.claude/references/ci-template.yml
# Adapted for secure-browser's stack:
#   - Rust napi-rs core (core/) replaces the Python "backend" service job
#   - Electron + TypeScript + Svelte app replaces the SDK/dashboard jobs
#   - NO service containers (Postgres/Vault): this app is local-first; its
#     only datastore is an embedded SQLCipher file, so there is no networked
#     service to boot. This is a documented, intentional deviation from the
#     template's `services:` blocks — not a drift toward mocks.
# Three-layer structure preserved:
#   1. Per-service jobs ........ `core` (Rust), `app` (Electron/TS/Svelte build)
#   2. Security gate (blocking) . `security-gate` (semgrep ci + gitleaks + test-quality)
#   3. Cross-service E2E ........ `e2e` (Playwright drives the built Electron app,
#                                 exercising the real JS<->Rust bridge), needs the above.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core:
    name: Core (Rust napi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (libudev for native FIDO2/HID client)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build native addon (napi)
        run: npm install && npm run build

      - name: Verify bridge artifact + Node load
        run: node -e "console.log(require('./index.js').coreVersion())"

  app:
    name: App (Electron/TS/Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (libudev for native FIDO2/HID client)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install dependencies
        run: npm install

      - name: Build Rust core (prerequisite for app build + types)
        run: npm run build:core

      - name: Type check (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Build app
        run: npm run build

  security-gate:
    name: Deterministic Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semgrep CI (SAST + Supply Chain)
        run: pip install semgrep && semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks

      - name: Secret scanning (gitleaks)
        run: gitleaks detect --source . --no-banner --exit-code 1

      - name: Test quality — no skipped tests (TypeScript)
        run: |
          echo "Checking for xit/xdescribe/test.skip/it.skip/describe.skip..."
          if grep -rn '\bxit\b\|xdescribe\b\|test\.skip\|it\.skip\|describe\.skip' --include='*.ts' --include='*.svelte' tests/ electron/ 2>/dev/null; then
            echo "❌ Found skipped tests in TypeScript"
            exit 1
          fi
          echo "✅ No skipped TypeScript tests found"

      - name: Test quality — no unconditional #[ignore] (Rust)
        run: |
          echo "Checking for unconditional #[ignore] in Rust tests..."
          # #[ignore = "reason"] is allowed (documented); bare #[ignore] is not.
          if grep -rn '#\[ignore\]' --include='*.rs' core/ 2>/dev/null; then
            echo "❌ Found bare #[ignore] — annotate with a reason or remove"
            exit 1
          fi
          echo "✅ No unconditional Rust test ignores found"

  e2e:
    name: E2E (Playwright drives built Electron app)
    runs-on: ubuntu-latest
    needs: [core, app, security-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (libudev for native FIDO2/HID client)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install dependencies
        run: npm install

      - name: Build Rust core
        run: npm run build:core

      - name: Build app
        run: npm run build

      - name: Install Playwright (with OS deps for Electron/Chromium)
        run: npx playwright install --with-deps

      - name: Run integration/E2E tests (headless via xvfb)
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
