[package]
name = "secure-browser-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
argon2 = "0.5"
aes-gcm = "0.10"
ml-kem = "0.2"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
