<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Create Account</title></head>
  <body>
    <h1>Create your account</h1>
    <!-- A realistic signup form: email + new password + confirm password.
         Two password fields → the parser classifies this as a "signup". -->
    <form id="signupForm">
      <input type="email" id="email" name="email" placeholder="Email" />
      <input type="password" id="new-password" name="new-password" placeholder="Create a password" />
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" />
      <button type="submit">Sign up</button>
    </form>
  </body>
</html>
